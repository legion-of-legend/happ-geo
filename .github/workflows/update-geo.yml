name: Update geo files

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build trimmed geo files
        run: python3 build.py

      - name: Check files load in Xray
        run: |
          curl -sSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p "$RUNNER_TEMP/xray" && unzip -q xray.zip xray -d "$RUNNER_TEMP/xray" && rm xray.zip
          python3 - <<'EOF'
          import json
          import build
          cfg = {
              "log": {"loglevel": "warning"},
              "inbounds": [{"port": 10999, "listen": "127.0.0.1", "protocol": "socks"}],
              "outbounds": [{"tag": "direct", "protocol": "freedom"}],
              "routing": {"rules": [
                  {"type": "field", "domain": ["geosite:" + t for t in sorted(build.GEOSITE_TAGS)], "outboundTag": "direct"},
                  {"type": "field", "ip": ["geoip:" + t for t in sorted(build.GEOIP_TAGS)], "outboundTag": "direct"},
              ]},
          }
          json.dump(cfg, open("/tmp/xray-test.json", "w"))
          EOF
          XRAY_LOCATION_ASSET="$PWD" "$RUNNER_TEMP/xray/xray" run -test -c /tmp/xray-test.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- geosite.dat geoip.dat; then
            echo "Geo files are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geosite.dat geoip.dat
          git commit -m "Update geo files $(date -u +%Y-%m-%d)"
          git push
